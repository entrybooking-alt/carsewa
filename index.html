<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Sewa · Anand Dham Ashram</title>
<style>
:root{--bg:#faf6ee;--card:#fffdf8;--ink:#2b2118;--mut:#7a6a58;--line:#eadfce;--sa:#d9822b;--sa2:#fbe8cf;--gr:#3f7d5a;--rd:#b5483a;--r:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#8a3d12,#d9822b);color:#fff;padding:18px 16px 54px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}header .wrap{padding:0}
h1{margin:0;font:700 22px/1.2 Georgia,serif}header p{margin:2px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:8px;margin-top:14px}
nav button{border:0;background:rgba(255,255,255,.18);color:#fff;padding:8px 16px;border-radius:99px;font:600 14px inherit;cursor:pointer}
nav button.on{background:#fff;color:#8a3d12}
main{margin-top:-36px;padding-bottom:50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(80,50,10,.05)}
.card h2{margin:0 0 12px;font-size:15px;letter-spacing:.2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:700 26px Georgia,serif;color:#8a3d12}.kpi span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,input,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.filters select{width:auto}
.trip{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.trip:first-of-type{border-top:0}
.date{min-width:52px;text-align:center;background:var(--sa2);border-radius:10px;padding:6px 4px;font-size:11px;color:#8a3d12;line-height:1.1}.date b{display:block;font-size:18px}
.trip .who{font-weight:650}.trip .rt{color:var(--mut);font-size:13px}.rem{font-size:12px;color:var(--mut);font-style:italic}.trip .gst{font-size:12px;color:var(--gr)}
.bar{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;padding:5px 0;cursor:pointer;font-size:14px}
.bar.static{cursor:default;grid-template-columns:200px 1fr 34px}
.bar .t{height:10px;background:var(--sa2);border-radius:9px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--sa);border-radius:9px}
.bar:hover .nm{color:#8a3d12;text-decoration:underline}.bar.static:hover .nm{text-decoration:none;color:inherit}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .n{text-align:right;font-weight:650}
.months{display:flex;align-items:flex-end;gap:6px;height:110px}.months div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.months i{display:block;background:var(--sa);border-radius:5px 5px 0 0;margin-bottom:3px}
.hint{display:flex;gap:10px;padding:8px 0;font-size:14px;border-top:1px solid var(--line)}.hint:first-of-type{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{background:var(--sa2);color:#8a3d12;border-radius:99px;padding:3px 10px;font-size:12px}
.chip.g{background:#e3f1e8;color:var(--gr)}.chip.r{background:#f7e1dd;color:var(--rd)}
form .f{margin-bottom:12px}form label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:#8a3d12;color:#fff;padding:12px 18px;border-radius:12px;font:700 15px inherit;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}.sug{font-size:13px;margin-top:6px;color:var(--rd)}.sug button{border:1px solid var(--rd);background:#fff;color:var(--rd);border-radius:99px;padding:2px 10px;margin-left:4px;cursor:pointer}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:14px}.ok{background:#e3f1e8;color:var(--gr)}.err{background:#f7e1dd;color:var(--rd)}
.demo{background:#fff4d6;border:1px solid #f0d78a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
#dr{position:fixed;inset:0;background:rgba(30,20,10,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
#dr.on{display:flex}#dr .sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}
.x{float:right;border:0;background:none;font-size:24px;cursor:pointer;color:var(--mut)}
.hide{display:none}.sl{display:inline-block;margin-left:8px;background:rgba(255,255,255,.2);color:#fff;text-decoration:none;padding:3px 10px;border-radius:99px;font-weight:600}.sl.hide{display:none}.more{width:100%;margin-top:8px;padding:10px;border:1px dashed var(--sa);background:none;color:#8a3d12;border-radius:10px;font:600 14px inherit;cursor:pointer}
textarea{resize:vertical}
@media(max-width:720px){input,select,textarea{font-size:16px}header{padding:66px 14px 50px}h1{font-size:19px}
.wrap{padding:0 12px}.card{padding:14px 12px}.kpi b{font-size:22px}
nav{position:fixed;top:0;left:0;right:0;z-index:5;background:#fff;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(80,50,10,.08)}
nav button{flex:1;background:var(--sa2);color:#8a3d12;padding:12px;font-size:15px}nav button.on{background:#8a3d12;color:#fff}
main{padding-bottom:30px}form .row{grid-template-columns:1fr}form .row.k{grid-template-columns:1fr 1fr}

.filters select{flex:1}.btn{padding:15px}.sug button{padding:6px 12px}#dr .sheet{max-height:92vh}.demo{font-size:12px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 28px}}
</style></head><body>
<header><div class="wrap"><h1>🚗 Car Sewa · Anand Dham Ashram</h1><p style="line-height:2">Sewa record &amp; sewadar profile <a id="sl" class="sl hide" target="_blank" rel="noopener">📊 Google Sheet dekho</a></p>
<nav><button id="n1" class="on" onclick="show('dash')">Dashboard</button><button id="n2" onclick="show('add')">+ Nayi entry</button></nav></div></header>
<main class="wrap">

<section id="dash">
 <div class="kpis" id="kpis"></div>
 <div class="filters" style="margin-top:14px">
  <select id="fp" onchange="render()"><option value="all">Poora time</option><option value="30">Pichhle 30 din</option><option value="90">Pichhle 90 din</option><option value="year">Is saal</option></select>
  <select id="fd" onchange="render()"></select>
 </div>
 <div class="grid">
  <div class="card"><h2>Pichhli 5 car sewa</h2><div id="last5"></div></div>
  <div class="card"><h2>Mahine ke hisaab se sewa</h2><div class="months" id="months"></div><h2 style="margin-top:18px">Routes</h2><div id="routes"></div></div>
 </div>
 <div class="grid">
  <div class="card"><h2>Sewadar profile <small style="font-weight:400;color:var(--mut)">(naam pe tap karo)</small></h2><div id="prof"></div></div>
  <div>
   <div class="card"><h2>Department</h2><div id="depts"></div></div>
   <div class="card"><h2>Sewa optimization hints</h2><div id="hints"></div></div>
  </div>
 </div>
</section>

<section id="add" class="hide"><div class="card"><h2>Nayi car sewa entry</h2>
<div id="fm"></div>
<form onsubmit="return submitTrip(event)" autocomplete="off">
 <div class="f"><label>Sewadar ka naam</label>
  <select id="fname" onchange="pickName()"></select>
  <input id="fnew" class="hide" placeholder="Naya naam likho" oninput="checkNew()" style="margin-top:8px">
  <div class="sug" id="sug"></div></div>
 <div class="row"><div class="f"><label>Department</label><select id="fdept"><option>Mandir</option><option>Langar</option><option>Washing</option><option>General</option><option>Management</option></select></div>
 <div class="f"><label>Mobile (optional)</label><input id="fmob" inputmode="numeric" maxlength="10"></div></div>
 <div class="row"><div class="f"><label>Date</label><input type="date" id="fdate" required></div>
 <div class="f"><label>Timing</label><input id="ftime" placeholder="jaise 4:00 - 7:00"></div></div>
 <div class="row"><div class="f"><label>Kahan se</label><select id="ffrom" onchange="other(this)"></select></div>
 <div class="f"><label>Kahan tak</label><select id="fto" onchange="other(this)"></select></div></div>
 <div class="f"><label>Gurumukh / Sangat ka naam</label><input id="fguest" list="gl"><datalist id="gl"></datalist></div>
 <div class="row"><div class="f"><label>Kisne pay kiya (optional)</label><input id="fpaid"></div>
 <div class="f"><label>Amount ₹ (optional)</label><input id="famt" inputmode="numeric"></div></div>
 <div class="f"><label>Remarks (optional)</label><textarea id="frem" rows="2" placeholder="Koi khaas baat, luggage, extra jaankari..."></textarea></div>
 <button class="btn" id="sb">Save karo</button>
</form></div></section>
</main>
<div id="dr" onclick="if(event.target===this)this.classList.remove('on')"><div class="sheet" id="drc"></div></div>

function normDate(v){
  if(v===""||v==null)return "";
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?"":d.toISOString().slice(0,10);}

  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;

}

    try{const s=localStorage.getItem("carsewa_demo");DB=s?JSON.parse(s):JSON.parse(JSON.stringify(SEED));}catch(e){DB=JSON.parse(JSON.stringify(SEED));}
    prep();fillForm();render();return;
  }
  let cached=null;try{cached=JSON.parse(localStorage.getItem("carsewa_cache"));}catch(e){}
  if(cached&&cached.trips){DB=cached;prep();fillForm();render();}
  else{DB={trips:[],members:[]};$("kpis").innerHTML='<div class="kpi" style="grid-column:1/-1"><b style="font-size:18px">⏳ Data load ho raha hai…</b><span>Pehli baar 5-10 second lag sakte hain</span></div>';}
  let fresh=await fetchData();
  for(let k=0;k<3&&!fresh;k++){await new Promise(r=>setTimeout(r,8000));fresh=await fetchData();}
  if(fresh){DB=fresh;try{localStorage.setItem("carsewa_cache",JSON.stringify(fresh))}catch(e){}prep();fillForm();render();status(null);}
  else if(cached){status(null);}
  else{status(["err",'Data abhi nahi aa paya. <button type="button" class="more" style="width:auto;padding:4px 12px;margin:0 0 0 6px" onclick="load()">Dobara try karo</button>']);render();}
}
function dd(s){return s?new Date(s+"T00:00:00"):null}
function filtered(){
  const p=$("fp").value, d=$("fd").value, now=new Date();
  return DB.trips.filter(t=>{
    if(d&&t.dept!==d)return false;
    const x=dd(t.date); if(p==="all")return true; if(!x)return false;
    if(p==="year")return x.getFullYear()===now.getFullYear();
    return (now-x)/864e5<=+p;
  });
}
function count(arr,fn){const m={};arr.forEach(t=>{const k=fn(t);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function bars(list,max,click){return list.map(([k,n])=>`<div class="bar ${click?"":"static"}" ${click?`onclick="profile('${esc(k).replace(/'/g,"&#39;")}')"`:""}><span class="nm">${esc(k)}</span><span class="t"><i style="width:${n/max*100}%"></i></span><span class="n">${n}</span></div>`).join("")||'<div style="color:var(--mut)">Koi data nahi</div>';}
function rt(t){return t.from_&&t.to?`${esc(t.from_)} → ${esc(t.to)}`:esc(t.note||[t.from_,t.to].filter(Boolean).join(" → ")||"—");}
function dbox(t){const x=dd(t.date);return x?`<div class="date"><b>${x.getDate()}</b>${MON[x.getMonth()]} ${String(x.getFullYear()).slice(2)}</div>`:`<div class="date"><b>?</b>date</div>`;}
function render(){
  const f=filtered(), all=DB.trips, now=new Date();
  const who=count(f,t=>t.name), m30=all.filter(t=>t.date&&(now-dd(t.date))/864e5<=30).length;
  const sorted=[...all].filter(t=>t.date).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $("kpis").innerHTML=[[f.length,"Total sewa"],[who.length,"Active sewadar"],[m30,"Pichhle 30 din"],[sorted[0]?dd(sorted[0].date).toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"—","Aakhri sewa"]].map(([a,b])=>`<div class="kpi"><b>${a}</b><span>${b}</span></div>`).join("");
  const dp=[...new Set(all.map(t=>t.dept).filter(Boolean))]; const cur=$("fd").value;
  $("fd").innerHTML='<option value="">Saare department</option>'+dp.map(d=>`<option ${d===cur?"selected":""}>${esc(d)}</option>`).join("");
  $("last5").innerHTML=sorted.slice(0,5).map(t=>`<div class="trip">${dbox(t)}<div><div class="who">${esc(t.name)}</div><div class="rt">${rt(t)}${t.timing&&t.timing!=="-"?" · "+esc(t.timing):""}</div>${t.guest?`<div class="gst">🙏 ${esc(t.guest)}</div>`:""}${t.remarks?`<div class="rem">📝 ${esc(t.remarks)}</div>`:""}</div></div>`).join("");
  const mm={};f.forEach(t=>{if(t.date){const k=t.date.slice(0,7);mm[k]=(mm[k]||0)+1}});const ks=Object.keys(mm).sort().slice(-8),mx=Math.max(1,...ks.map(k=>mm[k]));
  $("months").innerHTML=ks.map(k=>`<div><i style="height:${mm[k]/mx*80+4}px"></i>${mm[k]}<br>${MON[+k.slice(5)-1]}</div>`).join("")||"—";
  const rts=count(f,t=>t.from_&&t.to?t.from_+" → "+t.to:""); $("routes").innerHTML=bars(rts.slice(0,6),rts[0]?rts[0][1]:1,false);
  $("prof").innerHTML=bars(showAll?who:who.slice(0,10),who[0]?who[0][1]:1,true)+(who.length>10?`<button class="more" onclick="showAll=!showAll;render()">${showAll?"Kam dikhao":"Sab "+who.length+" dikhao"}</button>`:"");
  const dc=count(f,t=>t.dept); $("depts").innerHTML=bars(dc,dc[0]?dc[0][1]:1,false);
  // hints
  const H=[],tot=who.reduce((s,x)=>s+x[1],0),top3=who.slice(0,3).reduce((s,x)=>s+x[1],0);
  if(tot) H.push(`<div class="hint"><span>⚖️</span><div>Top 3 sewadar ne <b>${Math.round(top3/tot*100)}%</b> sewa ki (${who.slice(0,3).map(x=>esc(x[0])).join(", ")}). Baaki ko mauka dene se load balance hoga.</div></div>`);
  const last={};all.forEach(t=>{if(t.date&&(!last[t.name]||t.date>last[t.name]))last[t.name]=t.date});
  const idle=Object.entries(last).filter(([n,d])=>(now-dd(d))/864e5>90).map(x=>x[0]);
  if(idle.length)H.push(`<div class="hint"><span>💤</span><div><b>${idle.length}</b> sewadar ne 90+ din se sewa nahi ki:<div class="chips">${idle.map(n=>`<span class="chip r">${esc(n)}</span>`).join("")}</div></div></div>`);
  const once=who.filter(x=>x[1]===1).length; if(once)H.push(`<div class="hint"><span>🌱</span><div><b>${once}</b> sewadar ne sirf 1 baar sewa ki. Inko dobara jodne ka mauka.</div></div>`);
  const wk=count(f.filter(t=>t.date),t=>["Ravi","Som","Mangal","Budh","Guru","Shukra","Shani"][dd(t.date).getDay()]); if(wk[0])H.push(`<div class="hint"><span>📅</span><div>Sabse zyada sewa <b>${wk[0][0]}var</b> ko hoti hai (${wk[0][1]}).</div></div>`);
  $("hints").innerHTML=H.join("")||"—".repeat(1);
}
function profile(n){
  const t=DB.trips.filter(x=>x.name===n).sort((a,b)=>(b.date||"").localeCompare(a.date||"")), mem=DB.members.find(m=>m.name===n)||{};
  const rts=count(t,x=>x.from_&&x.to?x.from_+" → "+x.to:""), g=count(t,x=>x.guest);
  $("drc").innerHTML=`<button class="x" onclick="$('dr').classList.remove('on')">×</button><h2 style="margin:0;font-family:Georgia,serif">${esc(n)}</h2>
  <div class="chips"><span class="chip">${t.length} sewa</span>${mem.dept?`<span class="chip">${esc(mem.dept)}</span>`:""}${mem.mobile?`<span class="chip g">📞 ${esc(mem.mobile)}</span>`:""}</div>
  <div class="card" style="margin-top:12px"><h2>Routes</h2>${bars(rts.slice(0,5),rts[0]?rts[0][1]:1,false)}</div>
  <div class="card"><h2>Kitni sangat ki sewa</h2>${g.slice(0,6).map(([k,v])=>`<span class="chip g">${esc(k)} ×${v}</span>`).join(" ")||"—"}</div>
  <div class="card"><h2>Sewa history</h2>${t.slice(0,10).map(x=>`<div class="trip">${dbox(x)}<div><div class="rt" style="color:var(--ink)">${rt(x)}</div>${x.guest?`<div class="gst">🙏 ${esc(x.guest)}</div>`:""}</div></div>`).join("")}</div>`;
  $("dr").classList.add("on");
}
// ---------- form ----------
function fillForm(){
  const names=DB.members.map(m=>m.name).sort((a,b)=>a.localeCompare(b));
  $("fname").innerHTML='<option value="">— naam chuno —</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("")+'<option value="__new">➕ Naya naam daalo…</option>';
  const opts=PLACES.map(p=>`<option>${p}</option>`).join("")+'<option value="__o">Kuch aur…</option>';
  $("ffrom").innerHTML=opts; $("fto").innerHTML=opts; $("fto").value="Airport";
  $("fdate").value=new Date().toISOString().slice(0,10);
  $("gl").innerHTML=[...new Set(DB.trips.map(t=>t.guest).filter(Boolean))].map(g=>`<option value="${esc(g)}">`).join("");
}
function other(el){ if(el.value==="__o"){const v=prompt("Jagah ka naam likho:"); if(v){const o=new Option(v,v);el.add(o,el.options.length-1);el.value=v}else el.value=el.options[0].value;} }
function pickName(){
  const v=$("fname").value; $("fnew").classList.toggle("hide",v!=="__new"); $("sug").innerHTML="";
  const m=DB.members.find(x=>x.name===v); if(m){ if(m.dept)$("fdept").value=m.dept; $("fmob").value=m.mobile||""; }
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length];}
function checkNew(){
  const v=$("fnew").value.trim().toLowerCase(); if(v.length<3){$("sug").innerHTML="";return}
  const toks=v.split(/\s+/);
  const sim=DB.members.filter(m=>{const n=m.name.toLowerCase();return lev(n,v)<=2||toks.some(t=>t.length>3&&n.split(/\s+/).some(x=>lev(x,t)<=1))}).slice(0,4);
  $("sug").innerHTML=sim.length?'Kya yeh already hai? '+sim.map(m=>`<button type="button" onclick="useName('${esc(m.name).replace(/'/g,"&#39;")}')">${esc(m.name)}</button>`).join(""):"";
}
function useName(n){$("fname").value=n;pickName();$("fnew").value="";}
async function submitTrip(e){
  e.preventDefault(); const isNew=$("fname").value==="__new";
  const name=(isNew?$("fnew").value:$("fname").value).trim().replace(/\s+/g," ");
  if(!name){return flash("Naam chuno ya likho","err"),false}
  const trip={name,dept:$("fdept").value,mobile:$("fmob").value.trim(),date:$("fdate").value,timing:$("ftime").value.trim(),from_:$("ffrom").value,to:$("fto").value,guest:$("fguest").value.trim(),paid:$("fpaid").value.trim(),amount:$("famt").value?+$("famt").value:"",note:"",remarks:$("frem").value.trim()};
  $("sb").disabled=true;
  try{
    if(API_URL){
      const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"addTrip",trip})});
      const j=await r.json(); if(!j.ok)throw new Error(j.error||"Save nahi hua"); DB=j.data;try{localStorage.setItem("carsewa_cache",JSON.stringify(j.data))}catch(e){}prep();
    } else {
      trip.id=Math.max(0,...DB.trips.map(t=>+t.id||0))+1; DB.trips.push(trip);
      if(!DB.members.find(m=>m.name===name))DB.members.push({name,dept:trip.dept,mobile:trip.mobile});
      localStorage.setItem("carsewa_demo",JSON.stringify(DB));
    }
    flash("✅ Save ho gaya: "+name,"ok"); fillForm(); render(); $("fnew").value="";$("fnew").classList.add("hide");$("fguest").value="";$("fpaid").value="";$("famt").value="";$("ftime").value="";$("frem").value="";
  }catch(err){flash(err.message,"err")}
  $("sb").disabled=false; return false;
}
function flash(t,c){$("fm").innerHTML=`<div class="msg ${c}">${esc(t)}</div>`;setTimeout(()=>$("fm").innerHTML="",5000)}
if(SHEET_URL){$("sl").href=SHEET_URL;$("sl").classList.remove("hide")}
load();
</script></body></html>
